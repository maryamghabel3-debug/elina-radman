name: Render BasheV3 (V3 style comparison)

on:
  workflow_dispatch:
  push:
    branches: [arena/34e914e6-elina-radman]
    paths:
      - "psyche-studio/remotion/**"
      - "content/style_test/timeline.json"
      - "content/my_voice_cleaned_v3/full_voice_cleaned.mp3"

concurrency:
  group: render-bashe-v3
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: psyche-studio/remotion/package-lock.json

      - name: Install dependencies
        working-directory: psyche-studio/remotion
        run: npm ci

      - name: Ensure Chromium for Remotion render
        working-directory: psyche-studio/remotion
        run: npx remotion browser ensure

      - name: Render BasheV3 composition
        working-directory: psyche-studio/remotion
        run: >
          npx remotion render BasheV3 out/bashe_v3.mp4
          --codec=h264
          --crf=20
          --width=1080
          --height=1920
          --fps=30
          --entry-point=./src/index.tsx
          --audio=../../content/my_voice_cleaned_v3/full_voice_cleaned.mp3

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: bashe_v3
          path: psyche-studio/remotion/out/bashe_v3.mp4
          retention-days: 30
